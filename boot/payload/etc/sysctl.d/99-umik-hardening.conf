# --- power-loss resilience --------------------------------------------------
# Without a UPS the only defence is to keep very little dirty data in RAM.
# Flush the writeback thread every 1s and expire dirty pages after 2s, so an
# unannounced power cut loses ~1-2s of audio rather than the default ~30s.
vm.dirty_writeback_centisecs = 100
vm.dirty_expire_centisecs = 200
vm.dirty_background_ratio = 5
vm.dirty_ratio = 10

# No swap on this box; do not try to reclaim by swapping.
vm.swappiness = 1

# --- general hardening ------------------------------------------------------
kernel.kptr_restrict = 2
kernel.dmesg_restrict = 1
kernel.unprivileged_bpf_disabled = 1
kernel.kexec_load_disabled = 1
kernel.sysrq = 0
kernel.perf_event_paranoid = 3
kernel.yama.ptrace_scope = 2
kernel.randomize_va_space = 2
net.core.bpf_jit_harden = 2

fs.protected_hardlinks = 1
fs.protected_symlinks = 1
fs.protected_fifos = 2
fs.protected_regular = 2
fs.suid_dumpable = 0

# The network exists only inside umik-net-time's one-time NTP window; these
# make sure that window (or a maintenance cable) does not silently open the
# box up. IPv6 is off wholesale, and the box answers no pings - combined
# with the drop-all nftables table umik-net-time installs for the window,
# it originates traffic but is invisible to a scan.
net.ipv4.ip_forward = 0
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.all.rp_filter = 1
net.ipv4.tcp_syncookies = 1
net.ipv4.icmp_echo_ignore_all = 1
net.ipv6.conf.all.disable_ipv6 = 1
net.ipv6.conf.default.disable_ipv6 = 1
