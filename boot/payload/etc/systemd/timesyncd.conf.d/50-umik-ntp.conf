# umik-net-time fallback rung only: timesyncd runs when chrony (the NTS
# path) never got installed. Its server is hardcoded to Google's public
# NTP - not whatever the local DHCP server suggests (UseNTP is off in
# 90-umik-eth.network for the same reason). time.google.com is anycast,
# worldwide, and leap-smeared; a smeared second is far below this box's
# accepted drift. With NTP= set, timesyncd consults no fallback pool.
# timesyncd cannot speak NTS, so its result only counts after the TLS
# Date cross-check in umik-net-time. Note: installing chrony REMOVES
# systemd-timesyncd (conflicting time-daemon providers) - this file then
# stays behind harmlessly.
[Time]
NTP=time.google.com
