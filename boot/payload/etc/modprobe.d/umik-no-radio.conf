# Layer 3 of 4 of the radio-silence strategy.
#
#   1. config.txt  dtoverlay=disable-wifi / disable-bt  (hardware absent from DT)
#   2. cmdline.txt modprobe.blacklist=...               (boot-time blacklist)
#   3. this file   install <mod> /bin/false             (hard-fails modprobe)
#   4. firstrun    rm -f /lib/firmware/brcm/*           (no firmware to load)
#
# "blacklist" alone only stops automatic loading; an explicit `modprobe bluetooth`
# still works. `install ... /bin/false` makes even a deliberate load fail.

install brcmfmac /bin/false
install brcmutil /bin/false
install brcmfmac_wcc /bin/false
install cfg80211 /bin/false
install mac80211 /bin/false
install libarc4 /bin/false

install bluetooth /bin/false
install btbcm /bin/false
install btintel /bin/false
install btsdio /bin/false
install btusb /bin/false
install hci_uart /bin/false
install bnep /bin/false
install rfcomm /bin/false
install btrtl /bin/false
install btmtk /bin/false

install rfkill /bin/false
