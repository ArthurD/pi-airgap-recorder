# The RTL-SDR dongle (umik-sdr) belongs to librtlsdr, not to the kernel.
#
# The RTL2832U started life as a DVB-T TV stick, and the kernel still carries
# its TV driver: the moment the dongle enumerates, dvb_usb_rtl28xxu binds to
# it and pulls in the demodulators (rtl2832, rtl2830), the V4L2 SDR shim
# (rtl2832_sdr) and the tuner (r820t). That driver claims the dongle before
# librtlsdr can. Debian's librtlsdr does detach it on open, but reattaches it
# on close - so the TV driver would re-probe the dongle and re-initialise its
# tuner between every clip. Nothing on this box uses DVB, and neither rtl-sdr
# package ships a blacklist, so this file is the only thing keeping it off.
#
# "blacklist" stops the automatic load at enumeration; "install ... /bin/false"
# makes even a deliberate or dependency load fail - the same belt and braces
# the radio modules get in umik-no-radio.conf.
#
# This is NOT part of the radio-silence layers, and changes none of them: the
# dongle is receive-only (no transmitter, like the GPS), so the air-gap holds,
# and umik-radio-check still has to pass before umik-sdr records anything.

blacklist dvb_usb_rtl28xxu
blacklist rtl2832
blacklist rtl2830
blacklist rtl2832_sdr
blacklist r820t

install dvb_usb_rtl28xxu /bin/false
install rtl2832 /bin/false
install rtl2830 /bin/false
install rtl2832_sdr /bin/false
install r820t /bin/false
